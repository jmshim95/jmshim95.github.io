<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Baby Cam 송신</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
      body {
        font: 15px system-ui;
        margin: 0;
        padding: 16px;
        background: #111;
        color: #eee;
      }
      button {
        font: inherit;
        padding: 12px 16px;
        margin: 4px 0;
        border-radius: 10px;
        border: 0;
        background: #3b82f6;
        color: #fff;
        width: 100%;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
      }
      #dim {
        display: none;
        position: fixed;
        inset: 0;
        background: #000;
        color: #222;
        align-items: center;
        justify-content: center;
        z-index: 9;
      }
    </style>
  </head>
  <body>
    <h3>👶 송신기</h3>
    <button id="go">▶ 시작 (카메라/마이크 허용)</button>
    <div id="st">대기 중</div>
    <p>수신기 링크 (키가 # 뒤에 있어 서버로 전송되지 않음):</p>
    <input id="link" readonly />
    <button id="cp">링크 복사</button>
    <button id="tq">🔦 플래시 토글 (Android Chrome)</button>
    <button id="dm">🌑 화면 끄기(더미) — 탭하면 복귀</button>
    <div>소리 감지 임계값 <span id="db">-</span> dB</div>
    <div id="dim">화면 어둡게 유지 중 · 탭하여 복귀</div>
    <audio id="talk" autoplay></audio>
    <script>
      const $ = (id) => document.getElementById(id);
      const b64u = (a) =>
        btoa(String.fromCharCode(...a))
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=/g, "");
      const unb = (s) =>
        Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) =>
          c.charCodeAt(0),
        );
      const rnd = (n) => crypto.getRandomValues(new Uint8Array(n));
      async function keys(raw) {
        const h = (s) =>
          crypto.subtle.digest(
            "SHA-256",
            new Uint8Array([...raw, ...new TextEncoder().encode(s)]),
          );
        return {
          aes: await crypto.subtle.importKey(
            "raw",
            await h("e2ee"),
            "AES-GCM",
            false,
            ["encrypt", "decrypt"],
          ),
          mac: await crypto.subtle.importKey(
            "raw",
            await h("auth"),
            { name: "HMAC", hash: "SHA-256" },
            false,
            ["sign", "verify"],
          ),
        };
      }
      // E2EE 워커: 프레임 헤더(비디오10B/오디오1B)만 평문, 나머지 AES-GCM
      const W = `onrtctransform=e=>{const{readable,writable,options:o}=e.transformer;const enc=o.op=='enc',s=o.kind=='video'?10:1;
readable.pipeThrough(new TransformStream({async transform(f,c){try{const d=new Uint8Array(f.data);let out;
if(enc){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},o.key,d.subarray(s)));
out=new Uint8Array(s+ct.length+12);out.set(d.subarray(0,s));out.set(ct,s);out.set(iv,s+ct.length);}
else{const iv=d.subarray(d.length-12);const pt=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv},o.key,d.subarray(s,d.length-12)));
out=new Uint8Array(s+pt.length);out.set(d.subarray(0,s));out.set(pt,s);}
f.data=out.buffer;c.enqueue(f)}catch(_){}}})).pipeTo(writable)}`;
      const worker = new Worker(URL.createObjectURL(new Blob([W])));
      function e2ee(pc) {
        if (!window.RTCRtpScriptTransform) return false;
        pc.getSenders().forEach(
          (s) =>
            s.track &&
            (s.transform = new RTCRtpScriptTransform(worker, {
              op: "enc",
              kind: s.track.kind,
              key: aes,
            })),
        );
        pc.addEventListener(
          "track",
          (e) =>
            (e.receiver.transform = new RTCRtpScriptTransform(worker, {
              op: "dec",
              kind: e.track.kind,
              key: aes,
            })),
        );
        return true;
      }

      // TURN: 아래에 Metered.ca / coturn 정보를 추가하세요
      const ICE = [
        { urls: "stun:stun.l.google.com:19302" },
        /*,{urls:'turn:YOUR_HOST:443?transport=tcp',username:'USER',credential:'PASS'}*/
      ];
      let peer,
        stream,
        aes,
        mac,
        th = -35,
        loud = 0,
        lastAlert = 0,
        tOn = false,
        wl;
      const conns = new Map(),
        calls = new Map();

      $("go").onclick = async () => {
        let id = localStorage.bcId,
          k = localStorage.bcK;
        if (!id) {
          id = "bc-" + b64u(rnd(16));
          k = b64u(rnd(32));
          localStorage.bcId = id;
          localStorage.bcK = k;
        }
        ({ aes, mac } = await keys(unb(k)));
        // 발열/배터리: 720p, 15fps 상한, 후면 카메라
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "environment",
            width: { ideal: 1280 },
            height: { ideal: 720 },
            frameRate: { ideal: 15, max: 20 },
          },
          audio: {
            echoCancellation: true,
            noiseSuppression: false,
            autoGainControl: false,
          },
        });
        await lock();
        document.addEventListener(
          "visibilitychange",
          () => document.visibilityState == "visible" && lock(),
        );
        meter();
        peer = new Peer(id, { config: { iceServers: ICE } });
        peer.on("open", () => {
          $("st").textContent = "✅ 대기 중 (수신기 연결 가능)";
          $("link").value =
            new URL("receiver.html", location.href).href + "#" + id + "." + k;
        });
        peer.on("disconnected", () => peer.reconnect());
        peer.on("error", (e) => {
          $("st").textContent = "오류: " + e.type;
          if (e.type == "unavailable-id")
            setTimeout(() => location.reload(), 5000);
        });
        peer.on("connection", (c) => {
          const nonce = rnd(16);
          conns.set(c.peer, c);
          c.on("open", () => c.send({ t: "ch", n: b64u(nonce) }));
          c.on("data", async (m) => {
            if (m.t == "au") {
              // HMAC 챌린지-응답 통과 시에만 영상 송출
              const ok = await crypto.subtle.verify(
                "HMAC",
                mac,
                unb(m.s),
                nonce,
              );
              if (!ok) {
                c.close();
                return;
              }
              c.authed = true;
              startCall(c.peer);
            } else if (c.authed && m.t == "cfg") th = m.th;
          });
          c.on("close", () => {
            conns.delete(c.peer);
            calls.get(c.peer)?.close();
            calls.delete(c.peer);
          });
        });
      };
      function startCall(pid) {
        calls.get(pid)?.close();
        const call = peer.call(pid, stream);
        calls.set(pid, call);
        const pc = call.peerConnection;
        if (!e2ee(pc)) {
          $("st").textContent = "⚠ 이 브라우저는 E2EE 미지원";
        }
        try {
          const cap = RTCRtpSender.getCapabilities("video").codecs;
          const isH = (c) => /H264/i.test(c.mimeType);
          pc.getTransceivers().forEach(
            (t) =>
              t.sender.track?.kind == "video" &&
              t.setCodecPreferences([
                ...cap.filter(isH),
                ...cap.filter((c) => !isH(c)),
              ]),
          );
        } catch (_) {}
        setTimeout(() => {
          pc.getSenders().forEach((s) => {
            if (s.track?.kind != "video") return;
            const p = s.getParameters();
            if (!p.encodings?.length) p.encodings = [{}];
            p.encodings[0].maxBitrate = 1e6;
            s.setParameters(p).catch(() => {});
          });
        }, 2000);
        call.on("stream", (s) => {
          $("talk").srcObject = s;
        }); // 양방향: 부모 음성 재생
        call.on("close", () => calls.delete(pid));
      }
      function meter() {
        // 소리 감지 (RMS → dBFS)
        const ac = new AudioContext(),
          an = ac.createAnalyser();
        an.fftSize = 1024;
        ac.createMediaStreamSource(
          new MediaStream(stream.getAudioTracks()),
        ).connect(an);
        const buf = new Float32Array(an.fftSize);
        setInterval(() => {
          an.getFloatTimeDomainData(buf);
          let s = 0;
          for (const v of buf) s += v * v;
          const db = 20 * Math.log10(Math.sqrt(s / buf.length) || 1e-6);
          $("db").textContent = th + " (현재 " + db.toFixed(0) + ")";
          loud = db > th ? loud + 0.2 : Math.max(0, loud - 0.2);
          if (loud >= 1.5 && Date.now() - lastAlert > 10000) {
            lastAlert = Date.now();
            conns.forEach(
              (c) => c.authed && c.send({ t: "cry", db: Math.round(db) }),
            );
          }
        }, 200);
      }
      async function lock() {
        try {
          wl = await navigator.wakeLock.request("screen");
        } catch (_) {}
      }
      $("tq").onclick = async () => {
        const t = stream?.getVideoTracks()[0];
        if (!t?.getCapabilities?.().torch)
          return alert("Torch 미지원 (iOS Safari 불가)");
        tOn = !tOn;
        await t.applyConstraints({ advanced: [{ torch: tOn }] });
      };
      $("dm").onclick = () => ($("dim").style.display = "flex");
      $("dim").onclick = () => ($("dim").style.display = "none");
      $("cp").onclick = () => navigator.clipboard.writeText($("link").value);
    </script>
  </body>
</html>
